# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format .

      - name: Check formatting
        run: |
          if [[ -n $(git status -s | grep -v "pubspec.lock" | grep -E "\.dart$") ]]; then
            echo "::error::Code formatting issues found. Please run 'dart format .' locally and commit the changes."
            git diff -- "*.dart"
            exit 1
          fi

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release
